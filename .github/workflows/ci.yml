name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: test and prove proxy block
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci --omit=dev
      - name: Test
        run: npm test
      - name: Prove YouTube CONNECT is blocked
        env:
          LOCKIN_SKIP_PAC: "1"
          LOCKIN_SKIP_WATCHDOG: "1"
        run: npm run prove
